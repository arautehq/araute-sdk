name: Support question
description: Ask a question about using the SDK
title: "[Support]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, payment data, or other secrets. For vulnerabilities, follow SECURITY.md instead.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Explain what you are trying to do and where you are stuck.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK version
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a sanitized code sample or repository link if available.
