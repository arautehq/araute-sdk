name: Bug report
description: Report a reproducible problem with the SDK
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Never include API keys or other secrets.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and include the smallest possible reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: "@araute/sdk 0.1.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: "Node.js 20, Bun 1.3.10"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal data before sharing logs.
      render: shell
