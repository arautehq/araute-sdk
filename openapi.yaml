paths:
  /customers:
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Cria um customer.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Customer criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: Lista customers (keyset).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/EndingBefore'
        - name: email
          in: query
          schema: { type: string }
        - name: tax_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Lista de customers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerList'
        default:
          $ref: '#/components/responses/Problem'
  /customers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^cus_[0-9A-Za-z]+$' }
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Lê um customer.
      responses:
        '200':
          description: Customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Atualiza campos mutáveis. PATCH idempotente (sem Idempotency-Key).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      responses:
        '200':
          description: Customer atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          $ref: '#/components/responses/Problem'

  /products:
    post:
      tags: [Products]
      operationId: createProduct
      summary: Cria um product.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Product criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [Products]
      operationId: listProducts
      summary: Lista products (keyset).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/EndingBefore'
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Lista de products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        default:
          $ref: '#/components/responses/Problem'
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^prod_[0-9A-Za-z]+$' }
    get:
      tags: [Products]
      operationId: getProduct
      summary: Lê um product.
      responses:
        '200':
          description: Product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        default:
          $ref: '#/components/responses/Problem'

  /prices:
    post:
      tags: [Prices]
      operationId: createPrice
      summary: Cria um price (imutável).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceCreate'
      responses:
        '201':
          description: Price criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price'
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [Prices]
      operationId: listPrices
      summary: Lista prices (keyset).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/EndingBefore'
        - name: product
          in: query
          schema: { type: string, pattern: '^prod_[0-9A-Za-z]+$' }
        - name: active
          in: query
          schema: { type: boolean }
        - name: type
          in: query
          schema: { type: string, enum: [one_time, recurring] }
      responses:
        '200':
          description: Lista de prices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceList'
        default:
          $ref: '#/components/responses/Problem'
  /prices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^price_[0-9A-Za-z]+$' }
    get:
      tags: [Prices]
      operationId: getPrice
      summary: Lê um price.
      responses:
        '200':
          description: Price.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price'
        default:
          $ref: '#/components/responses/Problem'

  /payment_methods:
    get:
      tags: [PaymentMethods]
      operationId: listPaymentMethods
      summary: Lista payment methods de um customer (keyset). Filtro customer obrigatório.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/EndingBefore'
        - name: customer
          in: query
          required: true
          schema: { type: string, pattern: '^cus_[0-9A-Za-z]+$' }
        - name: type
          in: query
          schema: { type: string, enum: [card, pix] }
      responses:
        '200':
          description: Lista de payment methods.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodList'
        default:
          $ref: '#/components/responses/Problem'
  /payment_methods/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^pm_[0-9A-Za-z]+$' }
    get:
      tags: [PaymentMethods]
      operationId: getPaymentMethod
      summary: Lê um payment method (nunca PAN/CVV/token bruto).
      responses:
        '200':
          description: Payment method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        default:
          $ref: '#/components/responses/Problem'

  /payment_links:
    post:
      tags: [PaymentLinks]
      operationId: createPaymentLink
      summary: Cria um payment link.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentLinkCreate'
      responses:
        '201':
          description: Payment link criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLink'
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [PaymentLinks]
      operationId: listPaymentLinks
      summary: Lista payment links (keyset).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/EndingBefore'
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Lista de payment links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkList'
        default:
          $ref: '#/components/responses/Problem'
  /payment_links/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^plink_[0-9A-Za-z]+$' }
    get:
      tags: [PaymentLinks]
      operationId: getPaymentLink
      summary: Lê um payment link.
      responses:
        '200':
          description: Payment link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLink'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [PaymentLinks]
      operationId: updatePaymentLink
      summary: Atualiza active/after_completion/metadata. PATCH idempotente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentLinkUpdate'
      responses:
        '200':
          description: Payment link atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLink'
        default:
          $ref: '#/components/responses/Problem'

  /checkout_sessions:
    post:
      tags: [CheckoutSessions]
      operationId: createCheckoutSession
      summary: Cria uma checkout session.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutSessionCreate'
      responses:
        '201':
          description: Checkout session criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [CheckoutSessions]
      operationId: listCheckoutSessions
      summary: Lista checkout sessions (keyset).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/EndingBefore'
        - name: status
          in: query
          schema: { type: string, enum: [open, complete, expired] }
        - name: payment_link
          in: query
          schema: { type: string, pattern: '^plink_[0-9A-Za-z]+$' }
        - name: customer
          in: query
          schema: { type: string, pattern: '^cus_[0-9A-Za-z]+$' }
      responses:
        '200':
          description: Lista de checkout sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionList'
        default:
          $ref: '#/components/responses/Problem'
  /checkout_sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^cs_[0-9A-Za-z]+$' }
    get:
      tags: [CheckoutSessions]
      operationId: getCheckoutSession
      summary: Lê uma checkout session.
      responses:
        '200':
          description: Checkout session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        default:
          $ref: '#/components/responses/Problem'
  /checkout_sessions/{id}/expire:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^cs_[0-9A-Za-z]+$' }
    post:
      tags: [CheckoutSessions]
      operationId: expireCheckoutSession
      summary: Expira manualmente uma sessão open. Em complete → 409 checkout_session_not_open.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Checkout session expirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        default:
          $ref: '#/components/responses/Problem'

  /payment_intents:
    post:
      tags: [PaymentIntents]
      operationId: createPaymentIntent
      summary: Cria um payment intent (requires_payment_method).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentCreate'
      responses:
        '201':
          description: Payment intent criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [PaymentIntents]
      operationId: listPaymentIntents
      summary: Lista payment intents (keyset).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/EndingBefore'
        - name: customer
          in: query
          schema: { type: string, pattern: '^cus_[0-9A-Za-z]+$' }
        - name: status
          in: query
          schema:
            type: string
            enum: [requires_payment_method, requires_confirmation, requires_action, processing, succeeded, cancelled, expired]
      responses:
        '200':
          description: Lista de payment intents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentList'
        default:
          $ref: '#/components/responses/Problem'
  /payment_intents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^pi_[0-9A-Za-z]+$' }
    get:
      tags: [PaymentIntents]
      operationId: getPaymentIntent
      summary: Lê um payment intent.
      responses:
        '200':
          description: Payment intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        default:
          $ref: '#/components/responses/Problem'
  /payment_intents/{id}/confirm:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^pi_[0-9A-Za-z]+$' }
    post:
      tags: [PaymentIntents]
      operationId: confirmPaymentIntent
      summary: >
        Dispara uma tentativa. Recusa de pagamento NÃO é erro HTTP: retorna 200 com
        o intent de volta a requires_payment_method e last_payment_error preenchido.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentConfirm'
      responses:
        '200':
          description: Payment intent após a tentativa (inclui recusa via last_payment_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        default:
          $ref: '#/components/responses/Problem'
  /payment_intents/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^pi_[0-9A-Za-z]+$' }
    post:
      tags: [PaymentIntents]
      operationId: cancelPaymentIntent
      summary: Cancela um intent não-terminal. Em processing/terminal → 409 payment_intent_unexpected_state.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentCancel'
      responses:
        '200':
          description: Payment intent cancelado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        default:
          $ref: '#/components/responses/Problem'
  /payment_intents/{id}/attempts:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^pi_[0-9A-Za-z]+$' }
    get:
      tags: [PaymentIntents]
      operationId: listPaymentIntentAttempts
      summary: Lista os payment attempts do intent (keyset).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/EndingBefore'
      responses:
        '200':
          description: Lista de payment attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAttemptList'
        default:
          $ref: '#/components/responses/Problem'

  /charges:
    get:
      tags: [Charges]
      operationId: listCharges
      summary: Lista charges (keyset).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/EndingBefore'
        - name: payment_intent
          in: query
          schema: { type: string, pattern: '^pi_[0-9A-Za-z]+$' }
        - name: customer
          in: query
          schema: { type: string, pattern: '^cus_[0-9A-Za-z]+$' }
      responses:
        '200':
          description: Lista de charges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeList'
        default:
          $ref: '#/components/responses/Problem'
  /charges/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^ch_[0-9A-Za-z]+$' }
    get:
      tags: [Charges]
      operationId: getCharge
      summary: Lê uma charge.
      responses:
        '200':
          description: Charge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        default:
          $ref: '#/components/responses/Problem'

  /subscriptions:
    post:
      tags: [Subscriptions]
      operationId: createSubscription
      summary: Cria uma subscription.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
      responses:
        '201':
          description: Subscription criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [Subscriptions]
      operationId: listSubscriptions
      summary: Lista subscriptions (keyset).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/EndingBefore'
        - name: customer
          in: query
          schema: { type: string, pattern: '^cus_[0-9A-Za-z]+$' }
        - name: status
          in: query
          schema:
            type: string
            enum: [incomplete, active, trialing, past_due, unpaid, paused, cancelled]
        - name: price
          in: query
          schema: { type: string, pattern: '^price_[0-9A-Za-z]+$' }
      responses:
        '200':
          description: Lista de subscriptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionList'
        default:
          $ref: '#/components/responses/Problem'
  /subscriptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^sub_[0-9A-Za-z]+$' }
    get:
      tags: [Subscriptions]
      operationId: getSubscription
      summary: Lê uma subscription.
      responses:
        '200':
          description: Subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Subscriptions]
      operationId: updateSubscription
      summary: >
        Alteração canônica. Cria sempre um subch_. Idempotency-Key OBRIGATÓRIO
        (exceção à regra de PATCH). charge_now de upgrade só aplica após invoice.paid.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionUpdate'
      responses:
        '200':
          description: Subscription atualizada (pending_change quando charge_now de upgrade).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        default:
          $ref: '#/components/responses/Problem'
  /subscriptions/{id}/changes:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^sub_[0-9A-Za-z]+$' }
    post:
      tags: [Subscriptions]
      operationId: createSubscriptionChange
      summary: Cria mudança explícita/agendada (effective_at futuro).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionChangeCreate'
      responses:
        '201':
          description: Subscription change criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionChange'
        default:
          $ref: '#/components/responses/Problem'
    get:
      tags: [Subscriptions]
      operationId: listSubscriptionChanges
      summary: Lista os subch_ da assinatura (keyset).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/StartingAfter'
        - $ref: '#/components/parameters/EndingBefore'
      responses:
        '200':
          description: Lista de subscription changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionChangeList'
        default:
          $ref: '#/components/responses/Problem'
  /subscriptions/{id}/preview_change:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: '^sub_[0-9A-Za-z]+$' }
    post:
      tags: [Subscriptions]
      operationId: previewSubscriptionChange
