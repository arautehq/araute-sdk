# ⚠️ ARQUIVO GERADO — NÃO EDITAR À MÃO (spec-from-code, arbitrado 2026-07-09).
# Este openapi.yaml passa a ser SAÍDA do app (`@hono/zod-openapi`), gerado dos
# schemas Zod que validam a request na borda. Rode `pnpm openapi:generate` para
# regenerar; um check de CI (`pnpm openapi:check`) falha o build se este arquivo
# divergir da geração. Edições manuais são sobrescritas e pegas pelo CI.
# Estratégia: docs/api/documentation.md. Prosa/porquê: docs/api/public-api.md.
# (Enquanto a migração recurso-a-recurso não conclui, este arquivo é híbrido —
#  parte gerada, parte ainda manual; ver documentation.md §Migração.)
openapi: 3.1.0
info:
  title: Araute API
  version: 1.0.0-draft
  description: >
    API REST pública v1 do Araute — sistema de pagamentos brasileiro (core próprio,
    inspirado na Stripe, desacoplado de providers). Derivada fielmente de
    docs/api/public-api.md e docs/api/errors.md. Valores monetários em centavos
    (inteiro), moeda BRL; timestamps ISO 8601 UTC; erros RFC 7807
    (application/problem+json). Regra de ouro: o status de todo objeto é o estado
    da máquina interna, nunca o status bruto do provider.
servers:
  - url: https://api.araute.com/v1
    description: Produção e teste (o ambiente é determinado pela chave sk_live_/sk_test_)
security:
  - bearerAuth: []
tags:
  - name: Customers
  - name: Products
  - name: Prices
  - name: PaymentMethods
  - name: PaymentLinks
  - name: CheckoutSessions
  - name: PaymentIntents
  - name: Charges
  - name: Subscriptions
  - name: Invoices
  - name: Refunds
  - name: WebhookEndpoints
  - name: Events
  - name: TaxDocuments
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Authorization: Bearer <api_key>. Chaves secretas de servidor sk_test_... /
        sk_live_...; a chave define ambiente e account_id (multi-tenant). Não há
        chave publicável (pk_) na v1.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Obrigatório em todo POST que cria objeto ou dispara cobrança/efeito colateral.
        Mesma chave + mesmo payload → replay bit-a-bit da primeira resposta; mesma chave
        + payload diferente → 422 idempotency_error; mesma chave + mesmo payload ainda em
        voo (execução concorrente) → 409 idempotency_key_in_use (com Retry-After).
        Escopo por account_id + rota.
      schema:
        type: string
        maxLength: 255
    Limit:
      name: limit
      in: query
      required: false
      description: Tamanho da página (1–100, default 20). Paginação keyset.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StartingAfter:
      name: starting_after
      in: query
      required: false
      description: >
        Cursor keyset — id do último item da página anterior (paginação para frente).
        Id inexistente → 400 invalid_cursor.
      schema:
        type: string
    EndingBefore:
      name: ending_before
      in: query
      required: false
      description: >
        Cursor keyset — id do primeiro item da página atual (paginação para trás).
        Id inexistente → 400 invalid_cursor.
      schema:
        type: string

  responses:
    Problem:
      description: Erro (RFC 7807, application/problem+json).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Metadata:
      type: object
      description: Mapa string→string do merchant; devolvido como está. Nunca dado sensível.
      additionalProperties:
        type: string
      examples:
        - { erp_id: "9910" }

    Problem:
      type: object
      description: Envelope de erro RFC 7807 do Araute.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: urn:araute:error:<code>.
          examples: ["urn:araute:error:validation_error"]
        title:
          type: string
          description: Frase curta e estável para o mesmo code.
        status:
          type: integer
          description: HTTP status.
        detail:
          type: [string, "null"]
          description: Mensagem legível (pode variar/ser traduzida — não parsear).
        code:
          type: string
          description: >
            Identificador estável (o contrato). Fazer branch em cima de code, nunca
            de title/detail. Sempre com branch default (novos codes são aditivos).
          examples:
            - validation_error
            - invalid_cursor
            - authentication_required
            - permission_denied
            - resource_missing
            - idempotency_error
            - idempotency_key_in_use
            - rate_limited
            - provider_unavailable
            - internal_error
            - amount_invalid
            - currency_unsupported
            - payment_method_type_unsupported
            - payment_intent_unexpected_state
            - checkout_session_not_open
            - payment_method_not_reusable
            - currency_locked
            - subscription_not_modifiable
            - pending_change_exists
            - proration_preview_mismatch
            - invoice_not_payable
            - invoice_not_voidable
            - charge_not_refundable
            - refund_amount_exceeds_available
            - refund_window_expired
            - provider_insufficient_balance
            - tax_document_not_retryable
        param:
          type: [string, "null"]
          description: Campo do request associado (null se não aplicável).
        trace_id:
          type: string
          description: Correlação com logs/suporte.
        errors:
          type: array
          description: Violações por campo (erros de validação de schema).
          items:
            type: object
            required: [param, code, message]
            properties:
              param:
                type: string
              code:
                type: string
              message:
                type: string
        amount_refundable:
          type: integer
          description: Extensão presente em refund_amount_exceeds_available (saldo reembolsável em centavos).

    ListResponse:
      type: object
      description: Envelope genérico de lista (keyset). data é sobrescrito por recurso.
      required: [object, url, data, has_more, next_cursor]
      properties:
        object:
          type: string
          const: list
        url:
          type: string
        data:
          type: array
          items:
            type: object
        has_more:
          type: boolean
        next_cursor:
          type: [string, "null"]
          description: id a passar em starting_after na próxima página; null quando has_more=false.

    Address:
      type: [object, "null"]
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
          minLength: 2
          maxLength: 2
        postal_code:
          type: string
        country:
          type: string
          const: BR

    DeletedResource:
      type: object
      required: [id, object, deleted]
      properties:
        id:
          type: string
        object:
          type: string
        deleted:
          type: boolean
          const: true

    # ---------------- Customer ----------------
    Customer:
      type: object
      required: [id, object, balance, delinquent, livemode, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^cus_[0-9A-Za-z]+$'
        object:
          type: string
          const: customer
        name:
          type: [string, "null"]
        email:
          type: [string, "null"]
          format: email
        tax_id:
          type: [string, "null"]
          description: CPF/CNPJ.
        phone:
          type: [string, "null"]
        address:
          $ref: '#/components/schemas/Address'
        currency:
          type: [string, "null"]
          const: BRL
          description: Trava em BRL ao ganhar assinatura ativa; derivado (não editável).
        balance:
          type: integer
          description: Saldo de crédito em centavos; sinal NÃO invertido (+ = crédito a favor do cliente). Só muda por ledger.
        delinquent:
          type: boolean
        metadata:
          $ref: '#/components/schemas/Metadata'
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CustomerCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        email:
          type: string
          format: email
        tax_id:
          type: string
          description: CPF/CNPJ, validação de dígito verificador.
        phone:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        metadata:
          $ref: '#/components/schemas/Metadata'

    CustomerUpdate:
      type: object
      description: Subconjunto parcial de CustomerCreate. Não aceita balance/currency/delinquent (derivados).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        email:
          type: string
          format: email
        tax_id:
          type: string
        phone:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        metadata:
          $ref: '#/components/schemas/Metadata'

    # ---------------- Product ----------------
    Product:
      type: object
      required: [id, object, name, active, livemode, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^prod_[0-9A-Za-z]+$'
        object:
          type: string
          const: product
        name:
          type: string
        description:
          type: [string, "null"]
        active:
          type: boolean
        tax_code:
          type: [string, "null"]
          description: Código de serviço municipal para NFS-e; depende do provider fiscal.
        metadata:
          $ref: '#/components/schemas/Metadata'
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: string
          maxLength: 2000
        active:
          type: boolean
          default: true
        tax_code:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'

    # ---------------- Price ----------------
    PriceRecurring:
      type: [object, "null"]
      description: Ausente/null = preço avulso (one-time). Imutável após criação.
      required: [interval, interval_count]
      properties:
        interval:
          type: string
          enum: [day, week, month, year]
        interval_count:
          type: integer
          minimum: 1

    Price:
      type: object
      required: [id, object, product, currency, unit_amount, active, livemode, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^price_[0-9A-Za-z]+$'
        object:
          type: string
          const: price
        product:
          type: string
          pattern: '^prod_[0-9A-Za-z]+$'
        currency:
          type: string
          const: BRL
        unit_amount:
          type: integer
          description: Centavos. Imutável.
        nickname:
          type: [string, "null"]
        active:
          type: boolean
        recurring:
          $ref: '#/components/schemas/PriceRecurring'
        metadata:
          $ref: '#/components/schemas/Metadata'
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PriceCreate:
      type: object
      required: [product, unit_amount]
      properties:
        product:
          type: string
          pattern: '^prod_[0-9A-Za-z]+$'
        currency:
          type: string
          const: BRL
          default: BRL
        unit_amount:
          type: integer
          minimum: 1
          description: Centavos (inteiro positivo).
        nickname:
          type: string
        active:
          type: boolean
          default: true
        recurring:
          type: object
          required: [interval]
          properties:
            interval:
              type: string
              enum: [day, week, month, year]
            interval_count:
              type: integer
              minimum: 1
              default: 1
        metadata:
          $ref: '#/components/schemas/Metadata'

    # ---------------- PaymentMethod ----------------
    PaymentMethodCard:
      type: [object, "null"]
      description: Nunca expõe PAN completo/CVV/token bruto do provider.
      properties:
        brand:
          type: string
        last4:
          type: string
        exp_month:
          type: integer
        exp_year:
          type: integer
        funding:
          type: string

    MitConsent:
      type: [object, "null"]
      properties:
        enabled:
          type: boolean
          description: true é pré-requisito para cobrança recorrente MIT.
        reference:
          type: string
        consented_at:
          type: string
          format: date-time

    PaymentMethod:
      type: object
      required: [id, object, type, livemode, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^pm_[0-9A-Za-z]+$'
        object:
          type: string
          const: payment_method
        type:
          type: string
          enum: [card, pix]
        customer:
          type: [string, "null"]
          pattern: '^cus_[0-9A-Za-z]+$'
        card:
          $ref: '#/components/schemas/PaymentMethodCard'
        mit_consent:
          $ref: '#/components/schemas/MitConsent'
        metadata:
          $ref: '#/components/schemas/Metadata'
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ---------------- PaymentLink ----------------
    LineItem:
      type: object
      required: [price, quantity]
      properties:
        price:
          type: string
          pattern: '^price_[0-9A-Za-z]+$'
        quantity:
          type: integer
          minimum: 1

    AfterCompletion:
      type: object
      properties:
        type:
          type: string
          enum: [redirect, hosted_confirmation]
          default: hosted_confirmation
        redirect_url:
          type: [string, "null"]
          format: uri

    PaymentLink:
      type: object
      required: [id, object, active, url, currency, payment_method_types, livemode, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^plink_[0-9A-Za-z]+$'
        object:
          type: string
          const: payment_link
        active:
          type: boolean
        url:
          type: string
          format: uri
        line_items:
          type: [array, "null"]
          items:
            $ref: '#/components/schemas/LineItem'
        amount:
          type: [integer, "null"]
        currency:
          type: string
          const: BRL
        payment_method_types:
          type: array
          items:
            type: string
            enum: [pix, card]
        after_completion:
          $ref: '#/components/schemas/AfterCompletion'
        metadata:
          $ref: '#/components/schemas/Metadata'
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaymentLinkCreate:
      type: object
      description: Aceita line_items OU amount+currency (mutuamente exclusivos).
      properties:
        line_items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LineItem'
        amount:
          type: integer
          minimum: 1
          description: Exclusivo com line_items.
        currency:
          type: string
          const: BRL
          default: BRL
        payment_method_types:
          type: array
          default: [pix]
          items:
            type: string
            enum: [pix, card]
        active:
          type: boolean
          default: true
        after_completion:
          $ref: '#/components/schemas/AfterCompletion'
        metadata:
          $ref: '#/components/schemas/Metadata'

    PaymentLinkUpdate:
      type: object
      description: Atualiza active, after_completion, metadata. line_items/amount são imutáveis.
      properties:
        active:
          type: boolean
        after_completion:
          $ref: '#/components/schemas/AfterCompletion'
        metadata:
          $ref: '#/components/schemas/Metadata'

    # ---------------- CheckoutSession ----------------
    CheckoutSession:
      type: object
      required: [id, object, mode, status, payment_status, url, amount_total, currency, success_url, livemode, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^cs_[0-9A-Za-z]+$'
        object:
          type: string
          const: checkout_session
        mode:
          type: string
          enum: [payment, subscription]
        status:
          type: string
          enum: [open, complete, expired]
          description: Canônico open → complete | expired. expired é terminal e não regride.
        payment_status:
          type: string
          enum: [unpaid, paid, no_payment_required]
          readOnly: true
          description: Derivado do PaymentIntent; read-only (sem FSM própria, não persistido). complete ≠ pago (Pix assíncrono).
        url:
          type: string
          format: uri
        amount_total:
          type: integer
        currency:
          type: string
          const: BRL
        payment_intent:
          type: [string, "null"]
          pattern: '^pi_[0-9A-Za-z]+$'
        payment_link:
          type: [string, "null"]
          pattern: '^plink_[0-9A-Za-z]+$'
        success_url:
          type: string
        cancel_url:
          type: [string, "null"]
        expires_at:
          type: [string, "null"]
          format: date-time
        customer:
          type: [string, "null"]
          pattern: '^cus_[0-9A-Za-z]+$'
        metadata:
          $ref: '#/components/schemas/Metadata'
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CheckoutSessionCreate:
      type: object
      required: [success_url]
      description: Aceita line_items OU amount+currency (mutuamente exclusivos).
      properties:
        mode:
          type: string
          enum: [payment, subscription]
          default: payment
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          const: BRL
          default: BRL
        payment_method_types:
          type: array
          default: [pix]
          items:
            type: string
            enum: [pix, card]
        success_url:
          type: string
          format: uri
          description: Aceita placeholder {CHECKOUT_SESSION_ID}.
        cancel_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        customer:
          type: string
          pattern: '^cus_[0-9A-Za-z]+$'
        customer_email:
          type: string
          format: email
        customer_name:
          type: string
        customer_tax_id:
          type: string
        locale:
          type: string
          default: pt-BR
        metadata:
          $ref: '#/components/schemas/Metadata'

    # ---------------- PaymentIntent ----------------
    PixDisplayQrCode:
      type: object
      properties:
        data:
          type: string
        image_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time

    NextAction:
      type: [object, "null"]
      description: Polimórfico; contrato próprio, nunca o formato bruto do provider.
      properties:
        type:
          type: string
          enum: [pix_display_qr_code, redirect_to_url]
        pix_display_qr_code:
          $ref: '#/components/schemas/PixDisplayQrCode'
        redirect_to_url:
          type: object
          properties:
            url:
              type: string
              format: uri

    LastPaymentError:
      type: [object, "null"]
      description: >
        Recusa de pagamento normalizada (nunca status bruto do provider). ATENÇÃO:
        last_payment_error.code é namespace DIFERENTE do code do envelope RFC 7807.
      properties:
        code:
          type: string
          examples: [insufficient_funds, card_declined, expired_card, do_not_honor, invalid_cvc, fraud_suspected, processing_error, pix_expired]
        decline_code:
          type: string
        message:
          type: string

    PaymentIntent:
      type: object
      required: [id, object, status, amount, currency, payment_method_types, livemode, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^pi_[0-9A-Za-z]+$'
        object:
          type: string
          const: payment_intent
        status:
          type: string
          enum: [requires_payment_method, requires_confirmation, requires_action, processing, succeeded, cancelled, expired]
          description: succeeded/cancelled/expired terminais; succeeded nunca regride.
        amount:
          type: integer
        amount_received:
          type: integer
        currency:
          type: string
          const: BRL
        customer:
          type: [string, "null"]
          pattern: '^cus_[0-9A-Za-z]+$'
        payment_method_types:
          type: array
          items:
            type: string
            enum: [pix, card]
        next_action:
          $ref: '#/components/schemas/NextAction'
        latest_charge:
          type: [string, "null"]
          pattern: '^ch_[0-9A-Za-z]+$'
        last_payment_error:
          $ref: '#/components/schemas/LastPaymentError'
        cancellation_reason:
          type: [string, "null"]
        checkout_session:
          type: [string, "null"]
          pattern: '^cs_[0-9A-Za-z]+$'
        invoice:
          type: [string, "null"]
          pattern: '^inv_[0-9A-Za-z]+$'
        description:
          type: [string, "null"]
        metadata:
          $ref: '#/components/schemas/Metadata'
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaymentIntentCreate:
      type: object
      required: [amount, payment_method_types]
      properties:
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          const: BRL
          default: BRL
        payment_method_types:
          type: array
          minItems: 1
          items:
            type: string
            enum: [pix, card]
        customer:
          type: string
          pattern: '^cus_[0-9A-Za-z]+$'
        description:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'

    PaymentIntentConfirm:
      type: object
      properties:
        payment_method:
          type: string
          pattern: '^pm_[0-9A-Za-z]+$'
          description: Método salvo.
        payment_method_data:
          type: object
          properties:
            type:
              type: string
              enum: [pix, card]
        return_url:
          type: string
          format: uri
          description: Para redirect 3DS de cartão.

    PaymentIntentCancel:
      type: object
      properties:
        cancellation_reason:
          type: string
          enum: [duplicate, fraudulent, requested_by_customer, abandoned]

    PaymentAttempt:
      type: object
      required: [id, object, payment_intent, created_at]
      properties:
        id:
          type: string
          pattern: '^patt_[0-9A-Za-z]+$'
        object:
          type: string
          const: payment_attempt
        payment_intent:
          type: string
          pattern: '^pi_[0-9A-Za-z]+$'
        payment_method_type:
          type: string
          enum: [pix, card]
        status:
          type: string
          description: Sem state machine canônica formalizada (ver Decisões em aberto).
        charge:
          type: [string, "null"]
          pattern: '^ch_[0-9A-Za-z]+$'
        created_at:
          type: string
          format: date-time

    # ---------------- Charge ----------------
    ChargePixDetails:
      type: object
      properties:
        txid:
          type: string
        end_to_end_id:
          type: string
        payer:
          type: object
          properties:
            name:
              type: string
            tax_id:
              type: string

    PaymentMethodDetails:
      type: object
      description: Snapshot imutável do método usado.
      properties:
        type:
          type: string
          enum: [pix, card]
        pix:
          $ref: '#/components/schemas/ChargePixDetails'
        card:
          $ref: '#/components/schemas/PaymentMethodCard'

    Charge:
      type: object
      required: [id, object, status, amount, currency, payment_intent, livemode, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^ch_[0-9A-Za-z]+$'
        object:
          type: string
          const: charge
        status:
          type: string
          enum: [pending, succeeded, failed]
          description: Refund não muda status; rastreado por amount_refunded e objetos Refund.
        amount:
          type: integer
        amount_captured:
          type: integer
        amount_refunded:
          type: integer
        currency:
          type: string
          const: BRL
        payment_intent:
          type: string
          pattern: '^pi_[0-9A-Za-z]+$'
        customer:
          type: [string, "null"]
          pattern: '^cus_[0-9A-Za-z]+$'
        payment_method_details:
          $ref: '#/components/schemas/PaymentMethodDetails'
        refunded:
          type: boolean
        metadata:
          $ref: '#/components/schemas/Metadata'
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ---------------- Subscription ----------------
    SubscriptionItem:
      type: object
      required: [id, object, price, quantity]
      properties:
        id:
          type: string
          pattern: '^si_[0-9A-Za-z]+$'
        object:
          type: string
          const: subscription_item
        price:
          type: string
          pattern: '^price_[0-9A-Za-z]+$'
        quantity:
          type: integer
          minimum: 1
        current_period_start:
          type: string
          format: date-time
        current_period_end:
          type: string
          format: date-time
        metadata:
          $ref: '#/components/schemas/Metadata'

    CancellationDetails:
      type: [object, "null"]
      properties:
        reason:
          type: string
          enum: [requested_by_customer, payment_failure, fraud, other]
        feedback:
          type: string

    ProrationLine:
      type: object
      properties:
        description:
          type: string
        amount:
          type: integer
          description: + cobra, − credita.
        proration:
          type: boolean

    SubscriptionChange:
      type: object
      required: [id, object, status, subscription]
      properties:
        id:
          type: string
          pattern: '^subch_[0-9A-Za-z]+$'
        object:
          type: string
          const: subscription_change
        status:
          type: string
          enum: [pending, applied, payment_failed, expired, cancelled]
          description: Canônico pending → applied | payment_failed | expired | cancelled.
        subscription:
          type: string
          pattern: '^sub_[0-9A-Za-z]+$'
        proration_policy:
          type: string
          enum: [charge_now, next_cycle, credit, none]
        proration_amount:
          type: integer
          description: + cobra, − credita (crédito ao customer, sinal não invertido).
        proration_lines:
          type: array
          items:
            $ref: '#/components/schemas/ProrationLine'
        diff:
          type: [object, "null"]
          description: O que mudou.
          additionalProperties: true
        invoice:
          type: [string, "null"]
          pattern: '^inv_[0-9A-Za-z]+$'
        payment_intent:
          type: [string, "null"]
          pattern: '^pi_[0-9A-Za-z]+$'
        effective_at:
          type: [string, "null"]
          format: date-time
        applied_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Subscription:
      type: object
      required: [id, object, status, customer, collection_method, items, livemode, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^sub_[0-9A-Za-z]+$'
        object:
          type: string
          const: subscription
        status:
          type: string
          enum: [incomplete, active, trialing, past_due, unpaid, paused, cancelled]
          description: >
            incomplete → active | trialing | cancelled (timeout/desistência, com void da
            invoice inicial); active ⇄ past_due; past_due → unpaid | cancelled;
            paused (a partir de active); cancelled terminal (não existe incomplete_expired —
            expiração de incomplete = cancelled).
        customer:
          type: string
          pattern: '^cus_[0-9A-Za-z]+$'
        collection_method:
          type: string
          enum: [charge_automatically, send_invoice]
        payment_method_type:
          type: [string, "null"]
          enum: [card, pix_manual, null]
        default_payment_method:
          type: [string, "null"]
          pattern: '^pm_[0-9A-Za-z]+$'
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionItem'
        billing_cycle_anchor:
          type: [string, "null"]
          format: date-time
        trial_start:
          type: [string, "null"]
          format: date-time
        trial_end:
          type: [string, "null"]
          format: date-time
        trial_end_behavior:
          type: [string, "null"]
          enum: [cancel, pause, create_invoice, null]
        cancel_at_period_end:
          type: boolean
        cancel_at:
          type: [string, "null"]
          format: date-time
        cancelled_at:
          type: [string, "null"]
          format: date-time
        cancellation_details:
          $ref: '#/components/schemas/CancellationDetails'
        grace_period_days:
          type: integer
        latest_invoice:
          type: [string, "null"]
          pattern: '^inv_[0-9A-Za-z]+$'
        pending_change:
          oneOf:
            - $ref: '#/components/schemas/SubscriptionChange'
            - type: "null"
          description: Inline (sub-estado do fluxo, não expand).
        latest_change:
          type: [string, "null"]
          pattern: '^subch_[0-9A-Za-z]+$'
        pix_mandate:
          type: [string, "null"]
          description: V2.
        metadata:
          $ref: '#/components/schemas/Metadata'
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SubscriptionCreate:
      type: object
      required: [customer, items]
      description: Exige exatamente um de payment_method (cartão MIT) OU payment_method_type (pix_manual).
      properties:
        customer:
          type: string
          pattern: '^cus_[0-9A-Za-z]+$'
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [price]
            properties:
              price:
                type: string
                pattern: '^price_[0-9A-Za-z]+$'
              quantity:
                type: integer
                minimum: 1
                default: 1
        payment_method:
          type: string
          pattern: '^pm_[0-9A-Za-z]+$'
        payment_method_type:
          type: string
          enum: [pix_manual]
        collection_method:
          type: string
          enum: [charge_automatically, send_invoice]
          default: charge_automatically
        trial_period_days:
          type: integer
          minimum: 1
        trial_end:
          type: string
          format: date-time
          description: Exclusivo com trial_period_days.
        trial_end_behavior:
          type: string
          enum: [cancel, pause, create_invoice]
          default: create_invoice
        billing_cycle_anchor:
          oneOf:
            - type: string
              const: now
            - type: string
              format: date-time
        proration_policy:
          type: string
          enum: [charge_now, next_cycle, credit, none]
        grace_period_days:
          type: integer
          minimum: 0
        cancel_at_period_end:
          type: boolean
          default: false
        metadata:
          $ref: '#/components/schemas/Metadata'

    SubscriptionItemUpdate:
      type: object
      required: [id]
      properties:
        id:
          type: string
          pattern: '^si_[0-9A-Za-z]+$'
          description: OBRIGATÓRIO para trocar preço (nunca criar+deletar).
        price:
          type: string
          pattern: '^price_[0-9A-Za-z]+$'
        quantity:
          type: integer
          minimum: 1
          description: Omitir preserva a quantity atual.

    AddInvoiceItem:
      type: object
      required: [description, amount]
      properties:
        description:
          type: string
        amount:
          type: integer
        quantity:
          type: integer
          minimum: 1
          default: 1

    SubscriptionUpdate:
      type: object
      description: PATCH canônico de alteração. Cria sempre um subch_. Idempotency-Key obrigatório.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionItemUpdate'
        add_invoice_items:
          type: array
          items:
            $ref: '#/components/schemas/AddInvoiceItem'
        billing_cycle_anchor:
          oneOf:
            - type: string
              const: now
            - type: string
              format: date-time
        payment_method:
          type: string
          pattern: '^pm_[0-9A-Za-z]+$'
        proration_policy:
          type: string
          enum: [charge_now, next_cycle, credit, none]
        proration_date:
          type: string
          format: date-time
          description: Dia; casa preview↔apply.
        cancel_at_period_end:
          type: boolean
        metadata:
          $ref: '#/components/schemas/Metadata'

    SubscriptionChangeCreate:
      type: object
      description: Mudança explícita/agendada (effective_at futuro).
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionItemUpdate'
        add_invoice_items:
          type: array
          items:
            $ref: '#/components/schemas/AddInvoiceItem'
        billing_cycle_anchor:
          oneOf:
            - type: string
              const: now
            - type: string
              format: date-time
        payment_method:
          type: string
          pattern: '^pm_[0-9A-Za-z]+$'
        proration_policy:
          type: string
          enum: [charge_now, next_cycle, credit, none]
        proration_date:
          type: string
          format: date-time
        effective_at:
          oneOf:
            - type: string
              const: now
            - type: string
              format: date-time
          default: now
        metadata:
          $ref: '#/components/schemas/Metadata'

    SubscriptionChangePreviewRequest:
      type: object
      required: [proration_date]
      description: Mesmos campos de PATCH + proration_date obrigatório. Não cria nada.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionItemUpdate'
        add_invoice_items:
          type: array
          items:
            $ref: '#/components/schemas/AddInvoiceItem'
        billing_cycle_anchor:
          oneOf:
            - type: string
              const: now
            - type: string
              format: date-time
        payment_method:
          type: string
          pattern: '^pm_[0-9A-Za-z]+$'
        proration_policy:
          type: string
          enum: [charge_now, next_cycle, credit, none]
        proration_date:
          type: string
          format: date-time
        cancel_at_period_end:
          type: boolean

    SubscriptionChangePreview:
      type: object
      required: [object, subscription, proration_date, currency]
      properties:
        object:
          type: string
          const: subscription_change_preview
        subscription:
          type: string
          pattern: '^sub_[0-9A-Za-z]+$'
        proration_date:
          type: string
          format: date-time
        proration_policy:
          type: string
          enum: [charge_now, next_cycle, credit, none]
        proration_amount:
          type: integer
          description: + cobra; − credita (sinal não invertido).
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ProrationLine'
        currency:
          type: string
          const: BRL

    SubscriptionCancel:
      type: object
      properties:
        cancel_at_period_end:
          type: boolean
          default: false
          description: true = mantém acesso até current_period_end.
        prorate:
          type: boolean
          default: false
          description: Gera crédito/refund do tempo não usado (só cancelamento imediato).
        cancellation_details:
          type: object
          properties:
            reason:
              type: string
              enum: [requested_by_customer, payment_failure, fraud, other]
            feedback:
              type: string

    SubscriptionPause:
      type: object
      properties:
        resumes_at:
          type: string
          format: date-time
        entitlement_behavior:
          type: string
          enum: [keep, revoke]
          default: keep

    SubscriptionResume:
      type: object
      properties:
        payment_method:
          type: string
          pattern: '^pm_[0-9A-Za-z]+$'

    # ---------------- Invoice ----------------
    InvoiceItem:
      type: object
      required: [id, object, customer, description, quantity, unit_amount, amount, currency]
      properties:
        id:
          type: string
          pattern: '^ii_[0-9A-Za-z]+$'
        object:
          type: string
          const: invoice_item
        invoice:
          type: [string, "null"]
          pattern: '^inv_[0-9A-Za-z]+$'
        customer:
          type: string
          pattern: '^cus_[0-9A-Za-z]+$'
        description:
          type: string
        quantity:
          type: integer
        unit_amount:
          type: integer
        amount:
          type: integer
        currency:
          type: string
          const: BRL
        proration:
          type: boolean
        discountable:
          type: boolean
        metadata:
          $ref: '#/components/schemas/Metadata'

    CustomerSnapshot:
      type: [object, "null"]
      properties:
        name:
          type: string
        email:
          type: string
        tax_id:
          type: string

    Invoice:
      type: object
      required: [id, object, status, customer, currency, subtotal, total, amount_paid, amount_remaining, livemode, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^inv_[0-9A-Za-z]+$'
        object:
          type: string
          const: invoice
        status:
          type: string
          enum: [draft, open, paid, void, uncollectible]
          description: draft → open → paid | void | uncollectible; paid nunca regride.
        customer:
          type: string
          pattern: '^cus_[0-9A-Za-z]+$'
        subscription:
          type: [string, "null"]
          pattern: '^sub_[0-9A-Za-z]+$'
        number:
          type: [string, "null"]
        currency:
          type: string
          const: BRL
        subtotal:
          type: integer
        total:
          type: integer
        amount_paid:
          type: integer
        amount_remaining:
          type: integer
        collection_method:
          type: string
          enum: [charge_automatically, send_invoice]
        billing_reason:
          type: string
          enum: [manual, subscription_create, subscription_cycle, subscription_update]
        payment_intent:
          type: [string, "null"]
          pattern: '^pi_[0-9A-Za-z]+$'
        hosted_invoice_url:
          type: [string, "null"]
        invoice_pdf:
          type: [string, "null"]
        due_date:
          type: [string, "null"]
          format: date-time
        period_start:
          type: [string, "null"]
          format: date-time
        period_end:
          type: [string, "null"]
          format: date-time
        attempt_count:
          type: integer
        next_payment_attempt:
          type: [string, "null"]
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
        customer_snapshot:
          $ref: '#/components/schemas/CustomerSnapshot'
        metadata:
          $ref: '#/components/schemas/Metadata'
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InvoiceCreate:
      type: object
      required: [customer]
      description: Cria invoice draft (aditivo; detalhe em invoices.md).
      properties:
        customer:
          type: string
          pattern: '^cus_[0-9A-Za-z]+$'
        subscription:
          type: string
          pattern: '^sub_[0-9A-Za-z]+$'
        collection_method:
          type: string
          enum: [charge_automatically, send_invoice]
        due_date:
          type: string
          format: date-time
        metadata:
          $ref: '#/components/schemas/Metadata'

    InvoiceItemCreate:
      type: object
      required: [description, amount]
      description: Adiciona um item à invoice (aditivo; detalhe em invoices.md).
      properties:
        description:
          type: string
        amount:
          type: integer
        quantity:
          type: integer
          minimum: 1
          default: 1
        unit_amount:
          type: integer
        discountable:
          type: boolean
        metadata:
          $ref: '#/components/schemas/Metadata'

    InvoicePay:
      type: object
      properties:
        payment_method:
          type: string
          pattern: '^pm_[0-9A-Za-z]+$'
          description: Default = PM padrão do customer.

    # ---------------- Refund ----------------
    Refund:
      type: object
      required: [id, object, status, charge, payment_intent, amount, currency, livemode, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^re_[0-9A-Za-z]+$'
        object:
          type: string
          const: refund
        status:
          type: string
          enum: [pending, succeeded, failed]
          description: pending → succeeded | failed (ambos terminais; sem cancelled).
        charge:
          type: string
          pattern: '^ch_[0-9A-Za-z]+$'
        payment_intent:
          type: string
          pattern: '^pi_[0-9A-Za-z]+$'
        amount:
          type: integer
        currency:
          type: string
          const: BRL
        reason:
          type: [string, "null"]
        failure_reason:
          type: [string, "null"]
        metadata:
          $ref: '#/components/schemas/Metadata'
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RefundCreate:
      type: object
      required: [charge]
      properties:
        charge:
          type: string
          pattern: '^ch_[0-9A-Za-z]+$'
        amount:
          type: integer
          minimum: 1
          description: Ausente = total do valor ainda reembolsável.
        reason:
          type: string
          enum: [requested_by_customer, duplicate, fraudulent, other]
        metadata:
          $ref: '#/components/schemas/Metadata'

    # ---------------- Dispute ----------------
    Dispute:
      type: object
      description: >
        Contestação de uma Charge. State machine canônica (conventions):
        needs_response → under_review → won | lost. Sem endpoints públicos na v1
        (schema presente para webhooks/leitura futura).
      required: [id, object, status, charge, amount, currency, livemode, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^dp_[0-9A-Za-z]+$'
        object:
          type: string
          const: dispute
        status:
          type: string
          enum: [needs_response, under_review, won, lost]
        charge:
          type: string
          pattern: '^ch_[0-9A-Za-z]+$'
        payment_intent:
          type: [string, "null"]
          pattern: '^pi_[0-9A-Za-z]+$'
        amount:
          type: integer
        currency:
          type: string
          const: BRL
        reason:
          type: [string, "null"]
        evidence_due_by:
          type: [string, "null"]
          format: date-time
        metadata:
          $ref: '#/components/schemas/Metadata'
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ---------------- WebhookEndpoint ----------------
    WebhookEndpoint:
      type: object
      required: [id, object, url, enabled_events, status, livemode, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^we_[0-9A-Za-z]+$'
        object:
          type: string
          const: webhook_endpoint
        url:
          type: string
          format: uri
        enabled_events:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [enabled, disabled]
        secret:
          type: string
          pattern: '^whsec_[0-9A-Za-z]+$'
          description: Devolvido em claro apenas na criação e na rotação.
        description:
          type: [string, "null"]
        metadata:
          $ref: '#/components/schemas/Metadata'
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookEndpointCreate:
      type: object
      required: [url, enabled_events]
      properties:
        url:
          type: string
          format: uri
          description: https obrigatório (exceto localhost em teste).
        enabled_events:
          type: array
          minItems: 1
          items:
            type: string
          description: 'Nomes canônicos + extensão v1, ou ["*"].'
        description:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'

    WebhookEndpointUpdate:
      type: object
      properties:
        url:
          type: string
          format: uri
        enabled_events:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [enabled, disabled]
        description:
          type: string
        roll_secret:
          type: boolean
          description: true devolve novo secret (mantém o antigo válido por 24h).
        metadata:
          $ref: '#/components/schemas/Metadata'

    # ---------------- Event ----------------
    Event:
      type: object
      required: [id, object, type, api_version, created_at, data]
      properties:
        id:
          type: string
          pattern: '^evt_[0-9A-Za-z]+$'
        object:
          type: string
          const: event
        type:
          type: string
          description: 'Formato objeto.acao (ex.: payment_intent.succeeded).'
        api_version:
          type: string
          const: v1
        created_at:
          type: string
          format: date-time
        data:
          type: object
          required: [object]
          properties:
            object:
              type: object
              description: Snapshot completo do objeto no momento do evento.
              additionalProperties: true

    EventReplayRequest:
      type: object
      properties:
        webhook_endpoint:
          type: string
          pattern: '^we_[0-9A-Za-z]+$'
          description: Default = todos os habilitados para o tipo.

    EventReplayResponse:
      type: object
      required: [object, event, deliveries]
      properties:
        object:
          type: string
          const: event_replay
        event:
          type: string
          pattern: '^evt_[0-9A-Za-z]+$'
        deliveries:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                pattern: '^whd_[0-9A-Za-z]+$'
              webhook_endpoint:
                type: string
                pattern: '^we_[0-9A-Za-z]+$'
              status:
                type: string
                enum: [pending, succeeded, failed, dead]

    # ---------------- TaxDocument ----------------
    TaxDocument:
      type: object
      required: [id, object, status, type, customer, amount, currency, livemode, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: '^txd_[0-9A-Za-z]+$'
        object:
          type: string
          const: tax_document
        status:
          type: string
          enum: [pending, processing, issued, failed, cancelled]
          description: pending → processing → issued | failed; failed → pending (retry); issued → cancelled.
        type:
          type: string
          const: nfse
        invoice:
          type: [string, "null"]
          pattern: '^inv_[0-9A-Za-z]+$'
        charge:
          type: [string, "null"]
          pattern: '^ch_[0-9A-Za-z]+$'
        customer:
          type: string
          pattern: '^cus_[0-9A-Za-z]+$'
        amount:
          type: integer
        currency:
          type: string
          const: BRL
        number:
          type: [string, "null"]
        issued_at:
          type: [string, "null"]
          format: date-time
        cancelled_at:
          type: [string, "null"]
          format: date-time
        cancellation_reason:
          type: [string, "null"]
        failure_reason:
          type: [string, "null"]
        document_url:
          type: [string, "null"]
        metadata:
          $ref: '#/components/schemas/Metadata'
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ---------------- List wrappers ----------------
    CustomerList:
      allOf:
        - $ref: '#/components/schemas/ListResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Customer'
    ProductList:
      allOf:
        - $ref: '#/components/schemas/ListResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Product'
    PriceList:
      allOf:
